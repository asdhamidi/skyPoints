version: 2

models:
  - name: stg_member_profile_aus
    description: Harmonizes RAW.AUS_MEMBER_PROFILE into the canonical member profile shape (docs/01 §2).

  - name: stg_member_profile_ind
    description: Harmonizes RAW.IND_MEMBER_PROFILE into the canonical member profile shape (docs/01 §2).

  - name: stg_member_profile_usa
    description: Harmonizes RAW.USA_MEMBER_PROFILE into the canonical member profile shape (docs/01 §2).

  - name: stg_redemptions
    description: Flattens RAW.REDEMPTION_FEED into one row per transaction (docs/01 §7).
    columns:
      - name: txn_id
        tests:
          - not_null
      - name: member_id
        tests:
          - not_null

  - name: stg_member_profile
    description: >
      Canonical member profile (pre-validation) — union of the three per-source
      harmonization models (docs/01_Design_Specification.md §5, §6), plus derived Age
      and Stale_Member_Flag (docs/01 §6.1, §6.2) and *_raw diagnostic columns. Still
      contains rejected rows (a null mandatory field) at this point — see
      stg_member_profile_valid and rejected_member_records (docs/01 §10). Nothing
      downstream reads this model directly.
    columns:
      - name: country_code
        tests:
          - not_null
      - name: age
        description: Age as of feed_date (docs/01 §6.1). NULL where dob is NULL (all USA rows).
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 130
              config:
                where: "age is not null"

  - name: stg_member_profile_valid
    description: >
      Mandatory-field gate (docs/01 §8, §10) — the canonical member profile with
      rejected rows excluded. Everything downstream (the snapshot, marts) is built on
      this model, not stg_member_profile.
    columns:
      - name: member_key
        description: Synthesized surrogate key (country_code || '-' || member_id) — docs/01 §3.
        tests:
          - not_null
          - unique
      - name: member_id
        tests:
          - not_null
      - name: member_name
        tests:
          - not_null
      - name: enrollment_date
        tests:
          - not_null

  - name: rejected_member_records
    description: >
      Dead-letter queue (docs/01 §10) — one row per member record rejected for a null
      mandatory field, incremental and append-only so a repeat rejection on a later
      day is visible rather than collapsed.
    columns:
      - name: rejection_reason
        tests:
          - not_null
